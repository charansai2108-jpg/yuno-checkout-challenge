<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Yunique Fashion Store — Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    #order-summary { background: #f5f5f7; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
    #yuno-checkout { min-height: 320px; }
    #status { margin-top: 16px; font-weight: bold; }
    .error { color: #c0392b; }
    .success { color: #1e8449; }
  </style>
</head>
<body>
  <h1>Yunique Fashion Store — Checkout Demo</h1>

  <div id="order-summary">
    <strong>Order #DEMO-1001</strong><br />
    1x Denim Jacket — USD 89.00
  </div>

  <!-- SDK FULL mounts the pre-built card form here -->
  <div id="yuno-checkout"></div>

  <div id="status"></div>

  <!-- Load the Yuno Web SDK -->
  <script src="https://sdk-web.y.uno/v1.9/main.js"></script>

  <script>
    // --- CONFIG: replace with values from your Yuno Dashboard ---
    const YUNO_PUBLIC_API_KEY = "sandbox_gAAAAABqgYbgwC_n5Sihyts3IeM3s3MbT-fNrjqwQ1y8WNgV0jUFaSLrGbKB0i7sRknuOPl44WEV1_uK69iAkSOPcsM2bR33kcEc1G8UgEsgam8NBdBpcsXt2eHDOlJN37ph0-vAPp7kh3beN28q9s0gAQLvOdo7zRJCyf48Tvj-tB00g8jX3DPhlEjGdskOcEQvpv8qwokm6UaDS0gu40o1AVjDfHxSi9vCECNlUXZ0xHVTOrDQvdRMCTSOeqZViEhIopipSMkw";
    const BACKEND_BASE_URL = "http://localhost:5000";
    // --------------------------------------------------------------

    const statusEl = document.getElementById("status");

    async function init() {
      try {
        // 1. Ask our backend to create a Checkout Session (server-to-server, uses secret key)
        const sessionResp = await fetch(`${BACKEND_BASE_URL}/create-checkout-session`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: 89.00,
            currency: "USD",
            country: "US",
            customer: {
              first_name: "Jane",
              last_name: "Doe",
              email: "jane.doe@example.com"
            }
          })
        });
        const session = await sessionResp.json();
        if (!session.checkout_session) {
          throw new Error("No checkout_session returned from backend");
        }

        // 2. Initialize the Yuno SDK with the PUBLIC key (safe for client-side)
        const yuno = await window.SdkPayments.initialize(YUNO_PUBLIC_API_KEY);

        // 3. Mount the Full checkout UI, wired to the checkout session
        await yuno.startCheckout({
          checkoutSession: session.checkout_session,
          elementSelector: "#yuno-checkout",
          showPayButton: true,
          yunoCreatePayment: async (oneTimeToken, tokenWithInformation) => {
            statusEl.textContent = "Processing payment...";
            statusEl.className = "";

            // 4. Send the one-time token to OUR backend, which calls Create Payment (secret key)
            const paymentResp = await fetch(`${BACKEND_BASE_URL}/create-payment`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                checkout_session: session.checkout_session,
                one_time_token: oneTimeToken,
                token_with_information: tokenWithInformation || null
              })
            });
            const paymentResult = await paymentResp.json();

            if (paymentResult.sdk_action_required) {
              // Let the SDK handle 3DS / extra steps
              await yuno.continuePayment();
            }

            if (paymentResult.status === "SUCCEEDED") {
              statusEl.textContent = "Payment succeeded! Transaction ID: " + paymentResult.transaction_id;
              statusEl.className = "success";
            } else if (paymentResult.status === "DECLINED" || paymentResult.error) {
              statusEl.textContent = "Payment declined: " + (paymentResult.error || "See dashboard for details");
              statusEl.className = "error";
            } else {
              statusEl.textContent = "Payment status: " + paymentResult.status;
            }
          }
        });
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Error initializing checkout: " + err.message;
        statusEl.className = "error";
      }
    }

    // Wait for the SDK to be ready before initializing
    document.addEventListener("yuno-sdk-ready", init);
    // Fallback in case the event already fired before this listener was attached
    if (window.SdkPayments) init();
  </script>
</body>
</html>
